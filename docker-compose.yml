# Local development database (fallback if Supabase DB not configured)
# Usage: docker compose up -d
# Then set DATABASE_URL=postgresql+asyncpg://tenaciti:tenaciti@localhost:5432/tenaciti

services:
  postgres:
    image: postgres:16-alpine
    container_name: tenaciti-db
    environment:
      POSTGRES_USER: tenaciti
      POSTGRES_PASSWORD: tenaciti
      POSTGRES_DB: tenaciti
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
