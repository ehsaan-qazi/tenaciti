name: App CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/app/**'
      - 'packages/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/app/**'
      - 'packages/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./apps/app

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'
        
    - name: Install dependencies
      working-directory: .
      run: npm ci
        
    - name: Build
      working-directory: .
      run: npx turbo build --filter=@tenaciti/app
