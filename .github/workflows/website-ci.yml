name: Website CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/website/**'
      - 'packages/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/website/**'
      - 'packages/**'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './package-lock.json'
        
    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint --workspace=@tenaciti/website
        
    - name: Build
      run: npx turbo build --filter=@tenaciti/website
